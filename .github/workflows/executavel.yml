name: Executável do pen drive

# Monta o que vai para o pen drive, em dois artefatos separados de propósito:
#
#   PS-JAPA-pendrive  ~50 KB  o lançador, o .cmd e o leia-me. É o que basta
#                             em máquina que tenha Chrome ou Edge, que é
#                             toda máquina com Windows.
#   PS-JAPA-completo   370 MB a casca Electron, que carrega o próprio
#                             Chromium. Só serve quando não há navegador
#                             nenhum ou a rede força a pasta de perfil.
#
# Separados porque baixar 370 MB para usar 50 KB é o caminho errado por
# padrão. Empacotar para Windows a partir do Linux funciona nos dois casos:
# o empacotador do Electron só baixa o binário de win32, e o lançador sai do
# mingw.

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/executavel.yml"
  workflow_dispatch:

jobs:
  empacotar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar o compilador para Windows
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mingw-w64

      - name: Compilar o lançador
        working-directory: desktop
        # -Werror porque um aviso aqui é um executável que abre na mão do
        # usuário e falha de um jeito que ninguém consegue depurar no plantão.
        run: |
          x86_64-w64-mingw32-gcc -municode -mwindows -O2 -s \
            -Wall -Wextra -Werror -o "PS JAPA.exe" lancador.c
          ls -la "PS JAPA.exe"

      - name: Instalar o empacotador do Electron
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Empacotar a casca
        working-directory: desktop
        run: npm run empacotar

      - name: Montar as duas pastas
        run: |
          mkdir -p entrega/pendrive
          cp "desktop/PS JAPA.exe" "desktop/PS JAPA.cmd" "desktop/LEIA-ME.txt" entrega/pendrive/
          mv "desktop/dist/PS JAPA-win32-x64" entrega/completo
          cp "desktop/LEIA-ME.txt" entrega/completo/
          ls -la entrega/pendrive

      - uses: actions/upload-artifact@v4
        with:
          name: PS-JAPA-pendrive
          path: entrega/pendrive
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: PS-JAPA-completo
          path: entrega/completo
          retention-days: 30
