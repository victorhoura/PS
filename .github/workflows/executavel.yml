name: Executável do pen drive

# Monta a pasta que vai para o pen drive: o .exe do Electron, o lançador .cmd
# e o leia-me. O .exe tem ~370 MB (é o Chromium), por isso não fica no
# repositório — sai daqui como artefato para baixar.
#
# Empacotar para Windows a partir do Linux funciona: o empacotador só baixa o
# binário do Electron para win32 e copia os arquivos do app por cima.

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/executavel.yml"
  workflow_dispatch:

jobs:
  empacotar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar o empacotador
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Empacotar para Windows
        working-directory: desktop
        run: npm run empacotar

      - name: Juntar o lançador e o leia-me
        run: |
          destino="desktop/dist/PS JAPA-win32-x64"
          cp "desktop/PS JAPA.cmd" "$destino/"
          cp "desktop/LEIA-ME.txt" "$destino/"
          ls -la "$destino"

      - uses: actions/upload-artifact@v4
        with:
          name: PS-JAPA-pendrive
          path: "desktop/dist/PS JAPA-win32-x64"
          retention-days: 30
